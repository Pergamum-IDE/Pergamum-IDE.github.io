name: Deploy Pergamum User Manual

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pergamum
        uses: actions/checkout@v4
        with:
          repository: motoki-kentaro/Pergamum-IDE
          ref: main
          path: source
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build manual
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./source/docs/manual
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
